<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra cứu tài liệu Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap');

  :root{
    --bg:#F2F2F2; --surface:#FFFFFF; --surface-2:#F8F8F8; --border:#E1E1E1;
    --text:#262626; --text-muted:#5B5B5C; --text-faint:#8B8B8C;
    --accent:#C1292F; --accent-ink:#FFFFFF; --accent-wash:#F8E3E4;
    --ok:#1F7A4D; --ok-wash:#E3F3EA;
    --brand-red:#C1292F; --brand-yellow:#F2D13E; --brand-teal:#75C6CB; --brand-blue:#495BA6;
    --seg-0:#495BA6; --seg-0-ink:#FFFFFF;
    --seg-1:#75C6CB; --seg-1-ink:#0E3436;
    --seg-2:#F2D13E; --seg-2-ink:#262626;
    --seg-3:#C1292F; --seg-3-ink:#FFFFFF;
    --seg-4:#404041; --seg-4-ink:#FFFFFF;
    --seg-5:#2E3A78; --seg-5-ink:#FFFFFF;
    --seg-6:#3A9CA1; --seg-6-ink:#FFFFFF;
    --seg-7:#CFCFCF; --seg-7-ink:#262626;
    --focus-ring:#495BA6;
    --shadow: 0 1px 2px rgba(38,38,38,0.06), 0 8px 20px -12px rgba(38,38,38,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141416; --surface:#1E1E21; --surface-2:#252528; --border:#34343A;
      --text:#F2F2F2; --text-muted:#B7B7B9; --text-faint:#84848A;
      --accent:#E5535A; --accent-ink:#1A1113; --accent-wash:#3A1A1D;
      --ok:#5FD39A; --ok-wash:#173325;
      --seg-0:#7F8DD0; --seg-0-ink:#0E1430;
      --seg-1:#75C6CB; --seg-1-ink:#0E3436;
      --seg-2:#F2D13E; --seg-2-ink:#262626;
      --seg-3:#E5535A; --seg-3-ink:#1A1113;
      --seg-4:#C7C7CA; --seg-4-ink:#1B1B1D;
      --seg-5:#A3AEE6; --seg-5-ink:#141A3A;
      --seg-6:#5FC0C5; --seg-6-ink:#062A2C;
      --seg-7:#9B9B9E; --seg-7-ink:#101012;
      --focus-ring:#A3AEE6;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141416; --surface:#1E1E21; --surface-2:#252528; --border:#34343A;
    --text:#F2F2F2; --text-muted:#B7B7B9; --text-faint:#84848A;
    --accent:#E5535A; --accent-ink:#1A1113; --accent-wash:#3A1A1D;
    --ok:#5FD39A; --ok-wash:#173325;
    --seg-0:#7F8DD0; --seg-0-ink:#0E1430;
    --seg-1:#75C6CB; --seg-1-ink:#0E3436;
    --seg-2:#F2D13E; --seg-2-ink:#262626;
    --seg-3:#E5535A; --seg-3-ink:#1A1113;
    --seg-4:#C7C7CA; --seg-4-ink:#1B1B1D;
    --seg-5:#A3AEE6; --seg-5-ink:#141A3A;
    --seg-6:#5FC0C5; --seg-6-ink:#062A2C;
    --seg-7:#9B9B9E; --seg-7-ink:#101012;
    --focus-ring:#A3AEE6;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 28px -14px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Open Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    margin:0; padding-inline:20px; padding-block:24px 56px; font-size:15px; line-height:1.5;
  }
  @media (max-width:520px){ body{padding-inline:16px;} }
  .wrap{max-width:1180px; margin:0 auto;}

  header.page{display:flex; flex-wrap:wrap; gap:16px 32px; align-items:flex-end; justify-content:space-between; margin-bottom:22px;}
  .titleblock .eyebrow{font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); margin:0 0 6px;}
  h1{font-size:clamp(1.5rem, 1.1rem + 1.3vw, 2.05rem); font-weight:800; margin:0 0 6px; letter-spacing:-0.01em; text-wrap:balance;}
  .titleblock p{margin:0; color:var(--text-muted); max-width:62ch;}
  .meta{display:flex; gap:18px; flex-wrap:wrap; font-size:13px; color:var(--text-faint); white-space:nowrap;}
  .meta strong{color:var(--text); font-variant-numeric:tabular-nums;}

  .source-bar{
    display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px; margin-bottom:14px; font-size:13px; color:var(--text-muted);
  }
  .source-bar.drag{outline:2px dashed var(--accent); outline-offset:2px;}
  .source-bar .src strong{color:var(--text);}
  .source-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{
    font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;
    padding:8px 14px; border-radius:10px; border:1px solid var(--border);
    background:transparent; color:var(--text-muted);
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{border-color:var(--text-faint); color:var(--text);}
  .btn:focus-visible{outline:2px solid var(--focus-ring); outline-offset:1px;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn.primary:hover{filter:brightness(1.06); color:var(--accent-ink);}
  .btn svg{width:14px; height:14px;}
  .notice{font-size:13px; padding:8px 12px; border-radius:10px; margin-bottom:12px;}
  .notice.err{background:var(--accent-wash); color:var(--accent);}
  .notice.ok{background:var(--ok-wash); color:var(--ok);}

  .controls{
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding-block:12px 14px; border-bottom:1px solid var(--border); margin-bottom:20px;
    display:flex; flex-direction:column; gap:12px;
  }
  .search-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .search-box{flex:1 1 260px; position:relative;}
  .search-box input{
    width:100%; font-family:inherit; font-size:14.5px; padding:10px 14px 10px 36px;
    border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text);
  }
  .search-box input:focus-visible{outline:2px solid var(--focus-ring); outline-offset:1px;}
  .search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-faint);}

  .chiprow{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .chiprow .label.sub{min-width:0; margin-left:10px;}
  .chiprow .label{font-size:11.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-faint); margin-right:2px; min-width:86px;}
  .chip{
    font-family:inherit; font-size:13px; font-weight:600;
    border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    padding:6px 13px; border-radius:999px; cursor:pointer; line-height:1.3;
    display:inline-flex; align-items:center; gap:6px;
  }
  .chip:hover{border-color:var(--text-faint); color:var(--text);}
  .chip:focus-visible{outline:2px solid var(--focus-ring); outline-offset:1px;}
  .chip .dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:none;}
  .chip .n{font-size:11.5px; opacity:.7; font-variant-numeric:tabular-nums;}
  .chip[aria-pressed="true"]{background:var(--text); border-color:var(--text); color:var(--bg);}
  .chip.seg-chip[aria-pressed="true"]{color:var(--chip-ink); background:var(--chip-bg); border-color:var(--chip-bg);}
  .chip.mat-chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .count-line{font-size:13px; color:var(--text-faint); display:flex; gap:14px; flex-wrap:wrap; justify-content:space-between;}
  .count-line strong{color:var(--text); font-variant-numeric:tabular-nums;}
  .sort select{
    font-family:inherit; font-size:13px; color:var(--text); background:var(--surface);
    border:1px solid var(--border); border-radius:8px; padding:3px 6px;
  }

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:14px;}
  @media (max-width:360px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px 16px 14px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px; min-width:0;
  }
  .card.eol{opacity:.82;}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .card-id{min-width:0;}
  .badges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:7px;}
  .segbadge, .tag{
    display:inline-flex; align-items:center; font-size:11px; font-weight:700; letter-spacing:0.04em;
    text-transform:uppercase; padding:3px 9px; border-radius:6px;
  }
  .segbadge{background:var(--chip-bg); color:var(--chip-ink);}
  .tag{background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border);}
  .tag.eol{background:var(--accent-wash); color:var(--accent); border-color:transparent;}
  .model-name{font-size:17px; font-weight:700; margin:0; word-break:break-word; text-wrap:balance;}
  .tagline{margin-top:2px; font-size:12.5px; color:var(--text-muted); line-height:1.45;}
  .price{margin-top:6px; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums;}
  .price.none{font-weight:600; font-size:12.5px; color:var(--text-faint);}

  .completeness{font-size:12px; color:var(--text-faint); flex:none; text-align:right; font-variant-numeric:tabular-nums;}
  .completeness strong{color:var(--text);}
  .bar{width:56px; height:4px; border-radius:2px; background:var(--border); margin-top:5px; overflow:hidden;}
  .bar > span{display:block; height:100%; background:var(--accent); border-radius:2px;}

  .pills{display:grid; grid-template-columns:repeat(2, 1fr); gap:6px; margin-top:2px;}
  .pill{
    font-size:12.5px; font-weight:600; border-radius:8px; padding:7px 9px;
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    line-height:1.25; min-width:0;
  }
  .pill span.lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pill.avail{background:var(--accent); color:var(--accent-ink); text-decoration:none; cursor:pointer;}
  a.pill.avail:hover{filter:brightness(1.06);}
  .pill.avail:focus-visible, .pill .multi a:focus-visible{outline:2px solid var(--focus-ring); outline-offset:2px;}
  .pill.avail svg{width:12px; height:12px; flex:none; opacity:.9;}
  .pill .multi{display:flex; gap:3px; flex:none;}
  .pill .multi a{
    color:var(--accent-ink); text-decoration:none; font-size:11px; font-weight:800;
    min-width:20px; height:20px; border-radius:5px; display:inline-flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.22);
  }
  .pill .multi a:hover{background:rgba(255,255,255,.38);}
  .pill.file{background:var(--accent-wash); color:var(--accent); cursor:help;}
  .pill.none{background:var(--surface-2); color:var(--text-faint); border:1px dashed var(--border);}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-muted);
    border:1px dashed var(--border); border-radius:14px; background:var(--surface);
  }
  .empty-state strong{display:block; color:var(--text); font-size:15px; margin-bottom:4px;}

  footer{
    margin-top:34px; padding-top:16px; border-top:1px solid var(--border);
    font-size:12.5px; color:var(--text-faint); display:flex; flex-wrap:wrap; gap:8px 22px;
  }
  footer .key{display:inline-flex; align-items:center; gap:6px;}
  footer .swatch{width:10px; height:10px; border-radius:3px; display:inline-block;}

  @media (max-width:720px){ .controls{position:static;} }
  @media (max-width:520px){
    .pills{grid-template-columns:1fr;}
    .card-top{flex-direction:column;}
    .completeness{text-align:left;}
    .chiprow .label{min-width:0; width:100%;}
    .chiprow .label.sub{margin-left:0;}
  }

  .wrap{max-width:1320px;}
  /* ---- Nhận diện thương hiệu: sóng màu ViewSonic ---- */
  .brandbar{position:relative; margin:-24px -20px 18px; padding:18px 20px 8px; overflow:hidden;}
  .brand-waves-top{position:absolute; top:0; right:0; width:min(560px, 58vw); height:auto; pointer-events:none; z-index:0;}
  .brandbar-inner{position:relative; z-index:1; max-width:1320px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:nowrap; min-height:62px;}
  .brand-chip{display:inline-flex; background:#FFFFFF; border-radius:12px; padding:8px 14px; box-shadow:0 1px 2px rgba(38,38,38,.06);}
  .brand-logo{display:block; height:40px; width:auto;}
  .brand-link{
    font-size:13px; font-weight:700; color:#FFFFFF; text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    background:#2E3A78; padding:6px 12px; border-radius:999px; white-space:nowrap; flex:none;
  }
  .brand-link:hover{background:#232D61;}
  .brand-link:focus-visible{outline:2px solid #FFFFFF; outline-offset:2px;}
  .brand-link svg{width:13px; height:13px;}
  .brandfoot{position:relative; margin:34px -20px -56px; height:150px; overflow:hidden;}
  .brand-waves-bottom{position:absolute; left:0; bottom:0; width:min(720px, 72vw); height:auto; pointer-events:none;}
  .brandfoot-logo{
    position:absolute; right:0; bottom:0; background:#FFFFFF;
    padding:18px 28px 16px 64px; clip-path:polygon(44px 0, 100% 0, 100% 100%, 0 100%);
    border-top-left-radius:22px;
  }
  .brandfoot-logo img{display:block; height:30px; width:auto;}
  @media (max-width:520px){
    .brandbar{margin:-24px -16px 14px; padding:14px 16px 6px;}
    .brand-logo{height:26px;}
    .brand-chip{padding:6px 10px;}
    .brand-link{font-size:11.5px; padding:5px 10px;}
    .brand-waves-top{width:75vw;}
    .brandfoot{margin:28px -16px -56px; height:110px;}
    .brand-waves-bottom{width:92vw;}
    .brandfoot-logo{padding:12px 16px 10px 40px; clip-path:polygon(28px 0, 100% 0, 100% 100%, 0 100%);}
    .brandfoot-logo img{height:20px;}
  }
  .controls{position:static;}
  .filters-more{border:0; padding:0; margin:0;}
  .filters-more > summary{
    list-style:none; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--text-muted);
    display:inline-flex; align-items:center; gap:6px;
  }
  .filters-more > summary::-webkit-details-marker{display:none;}
  .filters-more > summary::before{content:"▸"; font-size:10px; transition:transform .15s;}
  .filters-more[open] > summary::before{transform:rotate(90deg);}
  .filters-more .chiprow{margin-top:10px;}
  .view-hint{font-size:12.5px; color:var(--text-faint);}

  /* ---- Board: mỗi phân khúc một cột ---- */
  .board{display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:14px; align-items:start;}
  .col{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-width:0; overflow:hidden;
  }
  .col-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border-bottom:1px solid var(--border); border-top:4px solid var(--chip-bg);
  }
  .col-head h2{font-size:14px; font-weight:800; margin:0; line-height:1.3;}
  .col-head .sub{font-size:11.5px; color:var(--text-faint); font-weight:600; margin-top:1px;}
  .col-head .num{
    flex:none; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums;
    background:var(--chip-bg); color:var(--chip-ink); border-radius:999px; padding:2px 9px;
  }
  .col-body{max-height:440px; overflow-y:auto; overscroll-behavior:contain; padding:6px;}
  .col-more{
    font-family:inherit; font-size:12.5px; font-weight:700; color:var(--text-muted); background:transparent;
    border:0; border-top:1px solid var(--border); padding:9px; cursor:pointer;
  }
  .col-more:hover{color:var(--text);}
  .item{
    width:100%; text-align:left; font-family:inherit; color:var(--text); cursor:pointer;
    background:transparent; border:0; border-radius:9px; padding:8px 9px;
    display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center;
  }
  .item:hover{background:var(--surface-2);}
  .item:focus-visible{outline:2px solid var(--focus-ring); outline-offset:-2px;}
  .item + .item{border-top:1px solid var(--border); border-radius:0;}
  .item:hover + .item{border-top-color:transparent;}
  .item .m{font-size:14px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item .p{font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;}
  .item .p.none{color:var(--text-faint); font-weight:600;}
  .item .s{font-size:12px; color:var(--text-muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item .c{display:flex; align-items:center; gap:6px; justify-content:flex-end; font-size:11.5px; color:var(--text-faint); font-variant-numeric:tabular-nums;}
  .item .c .bar{margin-top:0; width:36px;}

  /* ---- Thanh quay lại ---- */
  .backbar{
    position:sticky; top:0; z-index:6; background:var(--bg);
    display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap;
    padding:10px 0 12px; margin:-8px 0 12px; border-bottom:1px solid var(--border);
  }
  .back-btn{
    font-family:inherit; font-size:14.5px; font-weight:800; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px 10px 14px; border-radius:999px;
    background:var(--text); color:var(--bg); border:0;
    box-shadow:var(--shadow);
  }
  .back-btn:hover{filter:brightness(1.15);}
  .back-btn:focus-visible{outline:2px solid var(--focus-ring); outline-offset:2px;}
  .back-btn svg{width:18px; height:18px; flex:none;}
  .backbar-title{font-size:14px; font-weight:700; color:var(--text-muted); display:inline-flex; align-items:center; gap:8px;}
  .backbar-title .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  @media (max-width:520px){ .back-btn{width:100%; justify-content:center;} }

  /* ---- Chi tiết sản phẩm ---- */
  dialog.detail{
    border:0; padding:0; border-radius:16px; width:min(560px, calc(100vw - 32px));
    background:transparent; color:var(--text);
  }
  dialog.detail::backdrop{background:rgba(0,0,0,.45);}
  dialog.detail .card{box-shadow:0 20px 60px -20px rgba(0,0,0,.5); padding:18px 18px 16px;}
  .detail-close{
    font-family:inherit; font-size:20px; line-height:1; width:32px; height:32px; border-radius:8px; flex:none;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); cursor:pointer;
  }
  .detail-close:hover{color:var(--text);}
  .detail-close:focus-visible{outline:2px solid var(--focus-ring);}
  .card-actions{display:flex; gap:10px; align-items:flex-start;}

  @media (max-width:520px){
    .col-body{max-height:360px;}
    .board{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="brandbar">
  <svg class="brand-waves-top" viewBox="0 0 886 182" preserveAspectRatio="xMaxYMin meet" aria-hidden="true" focusable="false">
    <path fill="#75C6CB" d="M0 0 C110 44 220 98 360 103 C420 105 470 97 505 84 L292 0 Z"/>
    <path fill="#495BA6" d="M290 0 L886 0 L886 178 C808 184 735 168 650 136 C540 94 420 50 290 0 Z"/>

  const state = { query:'', seg:null, eol:false, npp:null, materials:new Set(), sort:'sheet' };

  const linkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtPrice = v => v == null ? null : new Intl.NumberFormat('vi-VN').format(v) + ' ₫';
  const segOf = key => DB.segments.find(s => s.key === key);
  const segVar = key => { const i = Math.max(0, DB.segments.findIndex(s => s.key === key)) % 8; return { bg:`var(--seg-${i})`, ink:`var(--seg-${i}-ink)` }; };
  const links = (m, t) => (m.materials[t] || []);
  const has = (m, t) => links(m, t).length > 0;
  const availCount = m => DB.types.filter(t => has(m, t)).length;
  const spec = m => {
    if (!m.name) return '';
    const i = m.name.toLowerCase().indexOf(m.model.toLowerCase());
    return (i >= 0 ? m.name.slice(i + m.model.length) : m.name).trim() || m.name;
  };
  const filtering = () => !!(state.query || state.seg || state.eol || state.npp || state.materials.size);

  function chip(label, pressed, onClick, cls = '', extra = '') {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip ' + cls;
    b.innerHTML = extra + esc(label);
    b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
    b.addEventListener('click', onClick);
    return b;
  }

  function buildChips() {
    const live = DB.models.filter(m => !m.eol);
    const segRow = $('segRow');
    segRow.innerHTML = '<span class="label">Dòng sản phẩm</span>';
    segRow.appendChild(chip('Tất cả', state.seg === null, () => { state.seg = null; refresh(); }));
    DB.segments.forEach(s => {
      const n = live.filter(m => m.segs.includes(s.key)).length;
      if (!n && !state.eol) return;
      const v = segVar(s.key);
      const b = chip(s.label, state.seg === s.key, () => { state.seg = state.seg === s.key ? null : s.key; refresh(); },
        'seg-chip', `<span class="dot" style="background:${v.bg}"></span>`);
      b.style.setProperty('--chip-bg', v.bg); b.style.setProperty('--chip-ink', v.ink);
      b.title = s.full;
      b.insertAdjacentHTML('beforeend', ` <span class="n">${n}</span>`);
      segRow.appendChild(b);
    });

    const stRow = $('statusRow');
    stRow.innerHTML = '';
    const npps = [...new Set(DB.models.flatMap(m => m.nppTokens))].filter(x => x !== 'ALL').sort();
    if (npps.length) {
      stRow.insertAdjacentHTML('beforeend', '<span class="label">Nhà phân phối</span>');
      npps.forEach(n => stRow.appendChild(chip(n, state.npp === n, () => { state.npp = state.npp === n ? null : n; refresh(); })));
    }
    const eolN = DB.models.filter(m => m.eol).length;
    if (eolN) {
      stRow.insertAdjacentHTML('beforeend', '<span class="label sub">Ngừng kinh doanh</span>');
      const b = chip('EOL', state.eol, () => { state.eol = !state.eol; refresh(); });
      b.insertAdjacentHTML('beforeend', ` <span class="n">${eolN}</span>`);
      b.title = 'Xem các sản phẩm đã ngừng kinh doanh';
      stRow.appendChild(b);
    }

    const matRow = $('matRow');
    matRow.innerHTML = '';
    DB.types.forEach(t => {
      matRow.appendChild(chip(t, state.materials.has(t), () => {
        state.materials.has(t) ? state.materials.delete(t) : state.materials.add(t); refresh();
      }, 'mat-chip'));
    });
    const cnt = state.materials.size;
    $('matDetails').querySelector('summary').textContent = 'Lọc theo loại tài liệu' + (cnt ? ` (${cnt})` : '');
    if (cnt) $('matDetails').open = true;
  }

  function matches(m) {
    if (state.eol ? !m.eol : m.eol) return false;
    if (state.seg && !m.segs.includes(state.seg)) return false;
    if (state.npp && !(m.nppTokens.includes(state.npp) || m.nppTokens.includes('ALL'))) return false;
    for (const t of state.materials) if (!has(m, t)) return false;
    if (state.query) {
      const words = state.query.toLowerCase().split(/\s+/).filter(Boolean);
      const segLabels = m.segs.map(k => (segOf(k) || {}).full || '').join(' ');
      const hay = [m.model, m.name, m.npp, segLabels].join(' ').toLowerCase();
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  }

  function pillHtml(t, urls) {
    if (!urls.length) return `<span class="pill none" title="${esc(t)}: chưa có"><span class="lbl">${esc(t)}</span></span>`;
    if (urls.length === 1) {
      return `<a class="pill avail" href="${esc(urls[0])}" target="_blank" rel="noopener noreferrer" title="${esc(t)}"><span class="lbl">${esc(t)}</span>${linkIcon}</a>`;
    }
    const a = urls.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(t)} – link ${i + 1}" title="${esc(t)} – link ${i + 1}">${i + 1}</a>`).join('');
    return `<span class="pill avail" title="${esc(t)}: ${urls.length} link"><span class="lbl">${esc(t)}</span><span class="multi">${a}</span></span>`;
  }

  function cardHtml(m, inDialog) {
    const v = segVar(m.segs[0]);
    const seg = segOf(m.segs[0]) || { label:'', full:'' };
    const total = DB.types.length, avail = availCount(m);
    const pct = total ? Math.round(avail / total * 100) : 0;
    const extraSegs = m.segs.slice(1).map(segOf).filter(Boolean)
      .map(s => `<span class="tag" title="${esc(s.full)}">${esc(s.label)}</span>`).join('');
    const tag = m.eol ? '<span class="tag eol">EOL</span>' : (m.npp ? `<span class="tag" title="Nhà phân phối">NPP: ${esc(m.npp)}</span>` : '');
    const price = fmtPrice(m.price);
    return `
      <article class="card${m.eol ? ' eol' : ''}">
        <div class="card-top">
          <div class="card-id">
            <div class="badges">
              <span class="segbadge" style="--chip-bg:${v.bg};--chip-ink:${v.ink}" title="${esc(seg.full)}">${esc(seg.label)}</span>
              ${extraSegs}${tag}
            </div>
            <h3 class="model-name">${esc(m.model)}</h3>
            ${m.name ? `<div class="tagline">${esc(m.name)}</div>` : ''}
            <div class="price${price ? '' : ' none'}">${price ? esc(price) : 'Giá: liên hệ'}</div>
          </div>
          <div class="card-actions">
            <div class="completeness" title="${avail} trên ${total} loại tài liệu">
              <strong>${avail}</strong>/${total}
              <div class="bar"><span style="width:${pct}%"></span></div>
            </div>
            ${inDialog ? '<button class="detail-close" type="button" aria-label="Đóng" data-close>×</button>' : ''}
          </div>
        </div>
        <div class="pills">${DB.types.map(t => pillHtml(t, links(m, t))).join('')}</div>
      </article>`;
  }

  function itemHtml(m, idx) {
    const price = fmtPrice(m.price);
    const total = DB.types.length, avail = availCount(m);
    return `<button class="item" type="button" data-i="${idx}" title="Xem tài liệu ${esc(m.model)}">
      <span class="m">${esc(m.model)}</span>
      <span class="p${price ? '' : ' none'}">${price ? esc(price) : 'Liên hệ'}</span>
      <span class="s">${esc(spec(m))}</span>
      <span class="c">${avail}/${total}<span class="bar"><span style="width:${total ? Math.round(avail / total * 100) : 0}%"></span></span></span>
    </button>`;
  }

  function sorted(list) {
    const arr = list.slice();
    const pr = (m, d) => m.price == null ? d : m.price;
    switch (state.sort) {
      case 'model': arr.sort((a, b) => a.model.localeCompare(b.model)); break;
      case 'priceAsc': arr.sort((a, b) => pr(a, Infinity) - pr(b, Infinity)); break;
      case 'priceDesc': arr.sort((a, b) => pr(b, -Infinity) - pr(a, -Infinity)); break;
      case 'complete': arr.sort((a, b) => availCount(b) - availCount(a)); break;
    }
    return arr;
  }

  function render() {
    const filtered = sorted(DB.models.filter(matches));
    const isFilter = filtering();
    const base = DB.models.filter(m => !m.eol).length;
    $('countLine').innerHTML = isFilter
      ? `Đang hiển thị <strong>${filtered.length}</strong> sản phẩm${state.eol ? ' đã ngừng kinh doanh' : ''}`
      : `<strong>${base}</strong> sản phẩm đang bán · <span class="view-hint">bấm vào một model để xem tài liệu</span>`;
    $('sortWrap').hidden = !isFilter;
    $('emptyState').hidden = filtered.length > 0;
    $('board').hidden = isFilter || !filtered.length;
    $('grid').hidden = !isFilter || !filtered.length;
    $('backBar').hidden = !isFilter;
    if (isFilter) {
      const sg = state.seg && segOf(state.seg);
      const parts = [];
      if (sg) parts.push(`<span class="dot" style="background:${segVar(sg.key).bg}"></span>${esc(sg.full)}`);
      if (state.eol) parts.push('Sản phẩm EOL');
      if (state.npp) parts.push('NPP ' + esc(state.npp));
      if (state.query) parts.push('Tìm “' + esc(state.query) + '”');
      if (state.materials.size) parts.push('Có ' + [...state.materials].map(esc).join(', '));
      $('backTitle').innerHTML = parts.join(' · ') + ` · ${filtered.length} sản phẩm`;
    }
    if (!filtered.length) { $('board').innerHTML = ''; $('grid').innerHTML = ''; return; }

    if (isFilter) {
      $('grid').innerHTML = filtered.map(m => cardHtml(m, false)).join('');
      $('board').innerHTML = '';
      return;
    }
    $('grid').innerHTML = '';
    $('board').innerHTML = DB.segments.map(s => {
      const list = filtered.filter(m => m.segs.includes(s.key));
      if (!list.length) return '';
      const v = segVar(s.key);
      const sub = s.full !== s.label ? s.full.replace(s.label, '').replace(/^\s*[–-]\s*/, '') : '';
      return `<section class="col" data-col="${esc(s.key)}" style="--chip-bg:${v.bg};--chip-ink:${v.ink}">
        <div class="col-head">
          <div><h2>${esc(s.label)}</h2>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>
          <span class="num" title="${list.length} model">${list.length}</span>
        </div>
        <div class="col-body">${list.map(m => itemHtml(m, DB.models.indexOf(m))).join('')}</div>
        <button class="col-more" type="button" data-seg="${esc(s.key)}">Xem thêm →</button>
      </section>`;
    }).join('');
  }

  function openDetail(m) {
    const d = $('detail');
    d.innerHTML = cardHtml(m, true);
    if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
    const c = d.querySelector('[data-close]'); if (c) c.focus();
  }
  $('detail').addEventListener('click', e => {
    const d = $('detail');
    if (e.target === d || e.target.closest('[data-close]')) { d.close ? d.close() : d.removeAttribute('open'); }
  });
  $('board').addEventListener('click', e => {
    const it = e.target.closest('.item');
    if (it) { openDetail(DB.models[+it.dataset.i]); return; }
    const more = e.target.closest('.col-more');
    if (more) { state.seg = more.dataset.seg; refresh(); window.scrollTo({ top: $('backBar').getBoundingClientRect().top + window.scrollY - 8 }); }
  });

  function refresh() { buildChips(); render(); }

  $('searchInput').addEventListener('input', e => { state.query = e.target.value.trim(); render(); });
  $('sortSel').addEventListener('change', e => { state.sort = e.target.value; render(); });
  function resetAll() {
    state.query = ''; state.seg = null; state.eol = false; state.npp = null; state.materials.clear();
    $('searchInput').value = ''; $('matDetails').open = false; refresh();
  }
  $('resetBtn').addEventListener('click', resetAll);
  $('backBtn').addEventListener('click', () => {
    const from = state.seg;
    resetAll();
    const col = from && $('board').querySelector(`[data-col="${CSS.escape(from)}"]`);
    const target = col || $('board');
    window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 16 });
    const first = (col || $('board')).querySelector('.item'); if (first) first.focus({ preventScroll:true });
  });

  (function init() {
    const st = DB.settings || {};
    $('tEyebrow').textContent = st.eyebrow || '';
    $('tTitle').textContent = st.title || 'Tra cứu tài liệu';
    $('tSub').textContent = st.subtitle || '';
    if (st.title) document.title = st.title;
    $('metaModels').textContent = DB.models.filter(m => !m.eol).length;
    $('metaLinks').textContent = DB.models.filter(m => !m.eol).reduce((n, m) => n + DB.types.filter(t => has(m, t)).length, 0);
    $('metaSegs').textContent = DB.segments.filter(s => DB.models.some(m => !m.eol && m.segs.includes(s.key))).length;
    try { $('footUpdated').textContent = 'Cập nhật: ' + new Date(DB.updatedAt).toLocaleDateString('vi-VN'); } catch (e) {}
    refresh();
  })();
</script>
</body>
</html>
